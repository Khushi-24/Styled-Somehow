# Relative to the process working directory, normally backend/.
spring.config.import=optional:file:./.env.staging[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/styled_somehow_staging}
media.directory=${MEDIA_DIRECTORY:./storage/staging-media}
server.address=${SERVER_ADDRESS:127.0.0.1}
# Rehearsal must never enable paid payments or courier booking.
app.production=false
payments.razorpay.live-enabled=false
shiprocket.booking-enabled=false
