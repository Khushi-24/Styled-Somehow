spring.application.name=styled-somehow
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/styled_somehow}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.flyway.enabled=true
admin.username=${ADMIN_USERNAME}
admin.password-hash=${ADMIN_PASSWORD_HASH}
media.directory=${MEDIA_DIRECTORY:./storage/media}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.error.include-message=always
server.error.include-stacktrace=never
