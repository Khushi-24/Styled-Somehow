# Temporary LOCAL DEVELOPMENT settings. Move credentials to private environment configuration before deployment.
# Replace the database username/password below with your local MySQL credentials.
spring.application.name=styled-somehow
spring.datasource.url=jdbc:mysql://localhost:3306/styled_somehow
spring.datasource.username=your_database_username
spring.datasource.password=your_database_password
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.flyway.enabled=true
admin.username=admin
admin.password-hash=REPLACE_WITH_YOUR_LOCAL_BCRYPT_HASH
media.directory=./storage/media
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=false
server.error.include-message=always
server.error.include-stacktrace=never
