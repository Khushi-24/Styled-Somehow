spring.application.name=styled-somehow
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.flyway.enabled=true

admin.username=${ADMIN_USERNAME:admin}
admin.password-hash=${ADMIN_PASSWORD_HASH}
media.directory=${MEDIA_DIRECTORY:./storage/media}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB

payments.razorpay.key-id=${RAZORPAY_KEY_ID:}
payments.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
payments.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
order-access.secret=${ORDER_ACCESS_SECRET:}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=always
server.error.include-stacktrace=never

# Shiprocket API user credentials (set in backend/.env)
shiprocket.email=${SHIPROCKET_EMAIL:}
shiprocket.password=${SHIPROCKET_PASSWORD:}

# Shipping origin; parcel dimensions are rounded up to whole centimetres
shiprocket.pickup-postcode=${SHIPROCKET_PICKUP_POSTCODE:380015}
shiprocket.pickup-location=${SHIPROCKET_PICKUP_LOCATION:Home}

# Enable only after KYC approval and live-payment readiness
shiprocket.booking-enabled=${SHIPROCKET_BOOKING_ENABLED:false}


# Hostinger SMTP: credentials belong in backend/.env only.
email.smtp.host=${SMTP_HOST:smtp.hostinger.com}
email.smtp.port=${SMTP_PORT:465}
email.smtp.username=${SMTP_USERNAME:}
email.smtp.password=${SMTP_PASSWORD:}
email.confirmations.enabled=${ORDER_CONFIRMATION_EMAIL_ENABLED:false}
email.store-url=${STORE_URL:http://localhost:3000}

# Optional Google login; keep disabled until OAuth credentials are configured.
auth.google.enabled=${GOOGLE_LOGIN_ENABLED:false}
auth.google.client-id=${GOOGLE_CLIENT_ID:}
auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
