spring.application.name=styled-somehow
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.flyway.enabled=true

admin.username=${ADMIN_USERNAME:admin}
admin.password-hash=${ADMIN_PASSWORD_HASH}
media.directory=${MEDIA_DIRECTORY:./storage/media}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB

payments.razorpay.key-id=${RAZORPAY_KEY_ID:}
payments.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
payments.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
email.brevo-api-key=${BREVO_API_KEY:}
email.sender=${EMAIL_SENDER:}
order-access.secret=${ORDER_ACCESS_SECRET:}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=always
server.error.include-stacktrace=never
